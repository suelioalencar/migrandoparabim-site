<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Migre de vez para o Revit com o curso Migrando para BIM 2.0 — 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de setembro (16:9)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#081320"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#0a1e30"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect x="0" y="0" width="1920" height="8" fill="#ffd400"/>

  <!-- painel lateral direito -->
  <rect x="1360" y="0" width="560" height="1080" fill="url(#panelGrad)"/>
  <line x1="1360" y1="0" x2="1360" y2="1080" stroke="#ffd400" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="1640" cy="360" rx="360" ry="360" fill="url(#glowBlue)" opacity="0.9"/>

  <g transform="translate(1500,215) scale(1.75)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- selo grande -->
  <g transform="translate(1640,700)" filter="url(#softShadow)">
    <circle r="150" fill="#ffd400"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="80" fill="#0f2439">20%</text>
    <text x="0" y="60" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="48" letter-spacing="4" fill="#0f2439">OFF</text>
  </g>

  <text x="1640" y="930" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="24" letter-spacing="1" fill="#a9c2d3">Cupom de setembro</text>
  <text x="1640" y="970" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="34" letter-spacing="2" fill="#ffd400">SETEMBRO20OFF</text>

  <!-- ================= COLUNA ESQUERDA ================= -->
  <g transform="translate(110,80)">
    <rect x="0" y="0" width="460" height="52" rx="26" fill="#ffd400"/>
    <text x="230" y="34" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="21" letter-spacing="2" fill="#0f2439">MIGRANDO PARA BIM 2.0</text>
  </g>

  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-1">
    <text x="110" y="252" font-size="62" fill="#f4f7fa">Chega de refazer o</text>
    <text x="110" y="322" font-size="62" fill="#f4f7fa">projeto elétrico <tspan fill="#ffd400">inteiro</tspan></text>
    <text x="110" y="392" font-size="62" fill="#f4f7fa">a cada revisão.</text>
  </g>

  <rect x="110" y="428" width="560" height="4" rx="2" fill="url(#ruleGrad)"/>

  <text x="110" y="486" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="27" fill="#8fa7b8" text-decoration="line-through">Projeto no CAD, contagem de material na mão.</text>

  <text x="110" y="548" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="34" fill="#dbe9f4">Migre de vez para o <tspan fill="#7fb8dc">Revit</tspan> com o curso</text>
  <text x="110" y="592" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="34" fill="#dbe9f4">mais completo do mercado.</text>
  <text x="110" y="636" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="26" fill="#8fa7b8">Do zero à entrega, com o plugin Pro-Elétrica.</text>

  <!-- chips de números -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="0.6">
    <g transform="translate(110,700)">
      <rect width="300" height="58" rx="29" fill="#16324a" stroke="#24425e"/>
      <text x="150" y="37" text-anchor="middle" fill="#eaf2f8">12 MÓDULOS · 51 AULAS</text>
    </g>
    <g transform="translate(424,700)">
      <rect width="220" height="58" rx="29" fill="#16324a" stroke="#24425e"/>
      <text x="110" y="37" text-anchor="middle" fill="#eaf2f8">+21H DE CURSO</text>
    </g>
    <g transform="translate(110,772)">
      <rect width="300" height="58" rx="29" fill="#16324a" stroke="#24425e"/>
      <text x="150" y="37" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
    <g transform="translate(424,772)">
      <rect width="220" height="58" rx="29" fill="#16324a" stroke="#24425e"/>
      <text x="110" y="37" text-anchor="middle" fill="#eaf2f8">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <!-- preço + CTA -->
  <g transform="translate(110,880)">
    <text x="0" y="22" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="24" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
    <text x="0" y="70" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="48" fill="#ffd400">12x de R$ 53,70</text>
    <text x="0" y="108" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
          font-size="23" fill="#dbe9f4">ou R$ 519,20 à vista</text>

    <g transform="translate(560,10)">
      <rect width="490" height="98" rx="20" fill="#ffd400"/>
      <text x="245" y="42" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
            font-weight="800" font-size="27" fill="#0f2439">GARANTA SUA VAGA →</text>
      <text x="245" y="76" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
            font-weight="700" font-size="21" fill="#0f2439" opacity="0.75">migrandoparabim.com.br</text>
    </g>
  </g>
</svg>
