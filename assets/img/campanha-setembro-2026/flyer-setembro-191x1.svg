<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Migre de vez para o Revit com o curso Migrando para BIM 2.0 — 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de setembro (horizontal 1,91:1)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#081320"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#0a1e30"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ffd400"/>

  <!-- painel direito -->
  <rect x="900" y="0" width="300" height="628" fill="url(#panelGrad)"/>
  <line x1="900" y1="0" x2="900" y2="628" stroke="#ffd400" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="1050" cy="220" rx="220" ry="220" fill="url(#glowBlue)" opacity="0.9"/>

  <g transform="translate(970,110) scale(0.98)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <g transform="translate(1050,400)" filter="url(#softShadow)">
    <circle r="86" fill="#ffd400"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="46" fill="#0f2439">20%</text>
    <text x="0" y="34" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="27" letter-spacing="2.5" fill="#0f2439">OFF</text>
  </g>

  <text x="1050" y="524" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="16" letter-spacing="0.6" fill="#a9c2d3">CUPOM DE SETEMBRO</text>
  <text x="1050" y="552" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="23" letter-spacing="1.4" fill="#ffd400">SETEMBRO20OFF</text>

  <!-- coluna esquerda -->
  <g transform="translate(56,44)">
    <rect x="0" y="0" width="330" height="40" rx="20" fill="#ffd400"/>
    <text x="165" y="27" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="16" letter-spacing="1.6" fill="#0f2439">MIGRANDO PARA BIM 2.0</text>
  </g>

  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-0.5">
    <text x="56" y="152" font-size="38" fill="#f4f7fa">Chega de refazer o projeto</text>
    <text x="56" y="198" font-size="38" fill="#f4f7fa">elétrico <tspan fill="#ffd400">inteiro</tspan> a cada revisão.</text>
  </g>

  <rect x="56" y="220" width="360" height="3" rx="1.5" fill="url(#ruleGrad)"/>

  <text x="56" y="256" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="18" fill="#8fa7b8" text-decoration="line-through">Projeto no CAD, contagem de material na mão.</text>

  <text x="56" y="296" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="23" fill="#dbe9f4">Migre de vez pro <tspan fill="#7fb8dc">Revit</tspan> com o curso mais</text>
  <text x="56" y="326" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="23" fill="#dbe9f4">completo do mercado.</text>
  <text x="56" y="358" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="19" fill="#8fa7b8">Do zero à entrega, com o plugin Pro-Elétrica.</text>

  <!-- chips -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="0.4">
    <g transform="translate(56,392)">
      <rect width="248" height="38" rx="19" fill="#16324a" stroke="#24425e"/>
      <text x="124" y="25" text-anchor="middle" fill="#eaf2f8">12 MÓDULOS · 51 AULAS</text>
    </g>
    <g transform="translate(316,392)">
      <rect width="176" height="38" rx="19" fill="#16324a" stroke="#24425e"/>
      <text x="88" y="25" text-anchor="middle" fill="#eaf2f8">+21H DE CURSO</text>
    </g>
    <g transform="translate(504,392)">
      <rect width="200" height="38" rx="19" fill="#16324a" stroke="#24425e"/>
      <text x="100" y="25" text-anchor="middle" fill="#eaf2f8">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <!-- preço + CTA -->
  <text x="56" y="472" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="17" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
  <text x="56" y="512" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="34" fill="#ffd400">12x de R$ 53,70</text>
  <text x="56" y="540" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="17" fill="#dbe9f4">ou R$ 519,20 à vista</text>

  <g transform="translate(56,564)">
    <rect width="330" height="50" rx="14" fill="#ffd400"/>
    <text x="165" y="24" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="18" fill="#0f2439">GARANTA SUA VAGA →</text>
    <text x="165" y="42" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="700" font-size="13" fill="#0f2439" opacity="0.75">migrandoparabim.com.br</text>
  </g>
</svg>
