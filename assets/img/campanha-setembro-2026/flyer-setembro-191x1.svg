<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Migrando para BIM 2.0 — oferta de setembro com 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de setembro (horizontal 1,91:1)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1"    stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="bimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8dc"/>
      <stop offset="1" stop-color="#bfe0f2"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1"    stop-color="#1481b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#grid)"/>
  <ellipse cx="140"  cy="60"   rx="560" ry="380" fill="url(#glowBlue)"/>
  <ellipse cx="1040" cy="600"  rx="460" ry="320" fill="url(#glowWarm)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ffd400"/>

  <!-- marca (direita) -->
  <ellipse cx="960" cy="270" rx="270" ry="270" fill="url(#glowBlue)" opacity="0.9"/>
  <g transform="translate(830.5,138.9) scale(1.2)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- selo de desconto -->
  <g transform="translate(1080,420)" filter="url(#softShadow)">
    <circle r="82" fill="#ffd400"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="44" fill="#0f2439">20%</text>
    <text x="0" y="32" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="27" letter-spacing="2.5" fill="#0f2439">OFF</text>
  </g>

  <!-- eyebrow -->
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="400" height="46" rx="23" fill="#ffd400"/>
    <text x="200" y="31" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="18" letter-spacing="2" fill="#0f2439">OFERTA DE SETEMBRO</text>
  </g>

  <!-- título -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-1">
    <text x="64" y="164" font-size="52" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="64" y="240" font-size="76" fill="url(#bimGrad)">BIM <tspan fill="#ffd400">2.0</tspan></text>
  </g>
  <text x="64" y="280" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="25" fill="#a9c2d3">com Revit + <tspan fill="#7fb8dc">Pro-Elétrica</tspan></text>

  <rect x="64" y="308" width="420" height="4" rx="2" fill="url(#ruleGrad)"/>

  <!-- preço -->
  <text x="64" y="360" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="22" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
  <text x="64" y="412" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="46" fill="#ffd400">12x de R$ 53,70</text>
  <text x="64" y="446" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="21" fill="#dbe9f4">ou R$ 519,20 à vista</text>

  <!-- cupom -->
  <g transform="translate(64,478)">
    <rect x="0" y="0" width="440" height="60" rx="14" fill="#ffd400" fill-opacity="0.1"
          stroke="#ffd400" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="22" y="38" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="18" letter-spacing="1.5" fill="#a9c2d3">CUPOM</text>
    <text x="112" y="39" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="25" letter-spacing="1.8" fill="#ffd400">SETEMBRO20OFF</text>
  </g>

  <!-- selos -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="0.8">
    <g transform="translate(64,562)">
      <rect width="220" height="42" rx="21" fill="#16324a" stroke="#24425e"/>
      <text x="110" y="27" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
    <g transform="translate(296,562)">
      <rect width="180" height="42" rx="21" fill="#16324a" stroke="#24425e"/>
      <text x="90" y="27" text-anchor="middle" fill="#eaf2f8">+21H DE AULAS</text>
    </g>
    <g transform="translate(488,562)">
      <rect width="200" height="42" rx="21" fill="#ffd400"/>
      <text x="100" y="27" text-anchor="middle" fill="#0f2439">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <text x="1136" y="600" text-anchor="end" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="20" letter-spacing="1" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
