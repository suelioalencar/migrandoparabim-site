<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Migrando para BIM 2.0 — oferta de setembro com 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de setembro (quadrado 1:1)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1"    stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="bimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8dc"/>
      <stop offset="1" stop-color="#bfe0f2"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <ellipse cx="180"  cy="120"  rx="680" ry="560" fill="url(#glowBlue)"/>
  <ellipse cx="920"  cy="980"  rx="600" ry="480" fill="url(#glowWarm)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#ffd400"/>

  <!-- eyebrow -->
  <g transform="translate(300,64)">
    <rect x="0" y="0" width="480" height="56" rx="28" fill="#ffd400"/>
    <text x="240" y="37" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="21" letter-spacing="2.3" fill="#0f2439">OFERTA DE SETEMBRO</text>
  </g>

  <!-- marca -->
  <ellipse cx="810" cy="200" rx="270" ry="230" fill="url(#glowBlue)" opacity="0.9"/>
  <g transform="translate(692.9,79.8) scale(1.1)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- selo de desconto -->
  <g transform="translate(892,320)" filter="url(#softShadow)">
    <circle r="98" fill="#ffd400"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="52" fill="#0f2439">20%</text>
    <text x="0" y="38" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="32" letter-spacing="3" fill="#0f2439">OFF</text>
  </g>

  <!-- título -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-1">
    <text x="80" y="380" font-size="62" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="80" y="466" font-size="90" fill="url(#bimGrad)">BIM <tspan fill="#ffd400">2.0</tspan></text>
  </g>
  <text x="80" y="514" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="30" fill="#a9c2d3">com Revit + <tspan fill="#7fb8dc">Pro-Elétrica</tspan></text>

  <rect x="80" y="548" width="500" height="4" rx="2" fill="url(#ruleGrad)"/>

  <!-- preço -->
  <text x="80" y="612" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="27" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
  <text x="80" y="678" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="60" fill="#ffd400">12x de R$ 53,70</text>
  <text x="80" y="720" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="26" fill="#dbe9f4">ou R$ 519,20 à vista</text>

  <!-- cupom -->
  <g transform="translate(80,760)">
    <rect x="0" y="0" width="600" height="78" rx="16" fill="#ffd400" fill-opacity="0.1"
          stroke="#ffd400" stroke-width="2" stroke-dasharray="12 9"/>
    <text x="30" y="49" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="23" letter-spacing="2" fill="#a9c2d3">CUPOM</text>
    <text x="150" y="50" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="32" letter-spacing="2.2" fill="#ffd400">SETEMBRO20OFF</text>
  </g>

  <!-- selos -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1">
    <g transform="translate(80,872)">
      <rect width="296" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="148" y="34" text-anchor="middle" fill="#eaf2f8">12 MÓDULOS GRAVADOS</text>
    </g>
    <g transform="translate(392,872)">
      <rect width="290" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="145" y="34" text-anchor="middle" fill="#eaf2f8">51 AULAS · +20H</text>
    </g>
  </g>
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1">
    <g transform="translate(80,938)">
      <rect width="296" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="148" y="34" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
    <g transform="translate(392,938)">
      <rect width="290" height="54" rx="27" fill="#ffd400"/>
      <text x="145" y="34" text-anchor="middle" fill="#0f2439">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <text x="80" y="1030" text-anchor="start" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="26" letter-spacing="1.2" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
