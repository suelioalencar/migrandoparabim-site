<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Migre de vez para o Revit com o curso Migrando para BIM 2.0 — 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de setembro (quadrado 1:1)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <ellipse cx="860" cy="150" rx="420" ry="320" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#ffd400"/>

  <!-- eyebrow -->
  <g transform="translate(60,54)">
    <rect x="0" y="0" width="400" height="48" rx="24" fill="#ffd400"/>
    <text x="200" y="32" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="19" letter-spacing="1.8" fill="#0f2439">MIGRANDO PARA BIM 2.0</text>
  </g>

  <!-- ícone + selo (topo direito) -->
  <g transform="translate(800,150) scale(0.62)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>
  <g transform="translate(955,312)" filter="url(#softShadow)">
    <circle r="82" fill="#ffd400"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="44" fill="#0f2439">20%</text>
    <text x="0" y="34" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="26" letter-spacing="2.5" fill="#0f2439">OFF</text>
  </g>

  <!-- headline -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-0.5">
    <text x="60" y="296" font-size="48" fill="#f4f7fa">Chega de refazer o</text>
    <text x="60" y="352" font-size="48" fill="#f4f7fa">projeto elétrico <tspan fill="#ffd400">inteiro</tspan></text>
    <text x="60" y="408" font-size="48" fill="#f4f7fa">a cada revisão.</text>
  </g>

  <rect x="60" y="438" width="460" height="4" rx="2" fill="url(#ruleGrad)"/>

  <text x="60" y="486" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="23" fill="#8fa7b8" text-decoration="line-through">Projeto no CAD, contagem de material na mão.</text>

  <text x="60" y="536" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="29" fill="#dbe9f4">Migre de vez para o <tspan fill="#7fb8dc">Revit</tspan> com o curso</text>
  <text x="60" y="572" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="29" fill="#dbe9f4">mais completo do mercado.</text>
  <text x="60" y="610" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="23" fill="#8fa7b8">Do zero à entrega, com o plugin Pro-Elétrica.</text>

  <!-- chips -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5">
    <g transform="translate(60,666)">
      <rect width="332" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="166" y="34" text-anchor="middle" fill="#eaf2f8">12 MÓDULOS · 51 AULAS</text>
    </g>
    <g transform="translate(410,666)">
      <rect width="238" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="119" y="34" text-anchor="middle" fill="#eaf2f8">+21H DE CURSO</text>
    </g>
    <g transform="translate(668,666)">
      <rect width="352" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="176" y="34" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
  </g>

  <!-- preço -->
  <text x="60" y="792" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="24" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
  <text x="60" y="852" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="56" fill="#ffd400">12x de R$ 53,70</text>
  <text x="60" y="892" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="24" fill="#dbe9f4">ou R$ 519,20 à vista</text>

  <!-- cupom -->
  <g transform="translate(60,930)">
    <rect x="0" y="0" width="600" height="76" rx="16" fill="#ffd400" fill-opacity="0.1"
          stroke="#ffd400" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="28" y="32" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="19" letter-spacing="1.5" fill="#a9c2d3">CUPOM DE SETEMBRO</text>
    <text x="28" y="60" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="28" letter-spacing="2" fill="#ffd400">SETEMBRO20OFF</text>
  </g>

  <text x="60" y="1042" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="24" letter-spacing="1" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
