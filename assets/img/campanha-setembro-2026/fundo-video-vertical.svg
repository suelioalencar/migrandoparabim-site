<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Fundo vertical para vídeo horizontal — Migrando para BIM 2.0, oferta de setembro">
  <title>Fundo vertical para vídeo 16:9 — Migrando para BIM 2.0</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1" stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ================= FUNDO GERAL ================= -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <ellipse cx="180" cy="180" rx="620" ry="420" fill="url(#glowBlue)"/>
  <ellipse cx="900" cy="1760" rx="560" ry="420" fill="url(#glowWarm)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#ffd400"/>

  <!-- ============================================================
       JANELA DO VÍDEO — 1080 x 608 (16:9), de y=656 a y=1264
       Cole/posicione o vídeo horizontal exatamente nesse retângulo.
       As linhas amarelas finas marcam a borda só como guia visual.
       ============================================================ -->
  <rect x="0" y="656" width="1080" height="608" fill="#050d16"/>
  <rect x="0" y="654" width="1080" height="3" fill="#ffd400" opacity="0.85"/>
  <rect x="0" y="1264" width="1080" height="3" fill="#ffd400" opacity="0.85"/>

  <!-- ================= BLOCO SUPERIOR (acima do vídeo) ================= -->
  <g transform="translate(64,72)">
    <rect x="0" y="0" width="430" height="54" rx="27" fill="#ffd400"/>
    <text x="215" y="36" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="21" letter-spacing="2" fill="#0f2439">MIGRANDO PARA BIM 2.0</text>
  </g>

  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="-1">
    <text x="64" y="232" font-size="56" fill="#f4f7fa">Chega de refazer o</text>
    <text x="64" y="298" font-size="56" fill="#f4f7fa">projeto elétrico <tspan fill="#ffd400">inteiro</tspan></text>
    <text x="64" y="364" font-size="56" fill="#f4f7fa">a cada revisão.</text>
  </g>

  <text x="64" y="420" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="27" fill="#8fa7b8">Migre de vez para o <tspan fill="#7fb8dc" font-weight="800">Revit</tspan> com o Pro-Elétrica.</text>

  <rect x="64" y="466" width="500" height="4" rx="2" fill="url(#ruleGrad)"/>

  <!-- ================= BLOCO INFERIOR (abaixo do vídeo) ================= -->
  <!-- selo de desconto -->
  <g transform="translate(900,1410)" filter="url(#softShadow)">
    <circle r="90" fill="#ffd400"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="48" fill="#0f2439">20%</text>
    <text x="0" y="36" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="28" letter-spacing="3" fill="#0f2439">OFF</text>
  </g>

  <text x="64" y="1420" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="26" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
  <text x="64" y="1486" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="60" fill="#ffd400">12x de R$ 53,70</text>
  <text x="64" y="1530" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500"
        font-size="25" fill="#dbe9f4">ou R$ 519,20 à vista</text>

  <!-- cupom -->
  <g transform="translate(64,1570)">
    <rect x="0" y="0" width="620" height="80" rx="16" fill="#ffd400" fill-opacity="0.1"
          stroke="#ffd400" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="28" y="33" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="20" letter-spacing="1.6" fill="#a9c2d3">CUPOM DE SETEMBRO</text>
    <text x="28" y="63" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="30" letter-spacing="2.1" fill="#ffd400">SETEMBRO20OFF</text>
  </g>

  <!-- chips -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5">
    <g transform="translate(64,1682)">
      <rect width="360" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="180" y="34" text-anchor="middle" fill="#eaf2f8">12 MÓDULOS · 51 AULAS</text>
    </g>
    <g transform="translate(438,1682)">
      <rect width="252" height="54" rx="27" fill="#16324a" stroke="#24425e"/>
      <text x="126" y="34" text-anchor="middle" fill="#eaf2f8">+21H DE CURSO</text>
    </g>
    <g transform="translate(704,1682)">
      <rect width="312" height="54" rx="27" fill="#ffd400"/>
      <text x="156" y="34" text-anchor="middle" fill="#0f2439">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <text x="64" y="1804" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="27" letter-spacing="1" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
