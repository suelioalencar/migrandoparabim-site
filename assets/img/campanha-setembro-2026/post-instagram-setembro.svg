<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Está no ar a Migrando para BIM 2.0 — Revit + Pro-Elétrica">
  <title>Migrando para BIM 2.0 — post de anúncio (feed 4:5)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1"    stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="bimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8dc"/>
      <stop offset="1" stop-color="#bfe0f2"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ================= FUNDO ================= -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <ellipse cx="180"  cy="120"  rx="720" ry="620" fill="url(#glowBlue)"/>
  <ellipse cx="920"  cy="1260" rx="560" ry="480" fill="url(#glowWarm)"/>
  <rect x="0" y="0" width="1080" height="7" fill="#ffd400"/>

  <!-- eyebrow -->
  <g transform="translate(300,72)">
    <rect x="0" y="0" width="480" height="58" rx="29" fill="#ffd400"/>
    <text x="240" y="38" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="22" letter-spacing="2.4" fill="#0f2439">TURMA 2.0 · VAGAS ABERTAS</text>
  </g>

  <!-- marca -->
  <ellipse cx="540" cy="300" rx="330" ry="270" fill="url(#glowBlue)" opacity="0.9"/>
  <g transform="translate(407.7,141.4) scale(1.35)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- anúncio -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif">
    <text x="540" y="548" font-weight="600" font-size="34" letter-spacing="0" fill="#a9c2d3">Setembro com desconto na</text>
  </g>

  <!-- título -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" letter-spacing="-1">
    <text x="540" y="656" font-weight="800" font-size="90" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="540" y="768" font-weight="800" font-size="120" fill="url(#bimGrad)">BIM <tspan fill="#ffd400">2.0</tspan></text>
  </g>

  <text x="540" y="826" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="38" fill="#a9c2d3">com Revit + <tspan fill="#7fb8dc">Pro-Elétrica</tspan></text>

  <rect x="290" y="866" width="500" height="4" rx="2" fill="url(#ruleGrad)"/>

  <!-- proposta -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="33" fill="#dbe9f4">
    <text x="540" y="932">Do absoluto zero à entrega do projeto elétrico,</text>
    <text x="540" y="978">na prática, com o plugin usado no curso.</text>
  </g>

  <!-- selo de desconto -->
  <g transform="translate(540,1096)" filter="url(#softShadow)">
    <rect x="-300" y="-56" width="600" height="112" rx="56" fill="#ffd400"/>
    <text x="-40" y="16" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="52" fill="#0f2439">20% OFF</text>
    <text x="204" y="14" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="700" font-size="24" fill="#0f2439">DE</text>
    <text x="204" y="38" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="700" font-size="24" fill="#0f2439">SETEMBRO</text>
  </g>

  <!-- selos -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1">
    <g transform="translate(24,1188)">
      <rect width="336" height="56" rx="28" fill="#16324a" stroke="#24425e"/>
      <text x="168" y="35" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
    <g transform="translate(372,1188)">
      <rect width="336" height="56" rx="28" fill="#16324a" stroke="#24425e"/>
      <text x="168" y="35" text-anchor="middle" fill="#eaf2f8">+21H DE AULAS</text>
    </g>
    <g transform="translate(720,1188)">
      <rect width="336" height="56" rx="28" fill="#16324a" stroke="#24425e"/>
      <text x="168" y="35" text-anchor="middle" fill="#eaf2f8">GARANTIA 7 DIAS</text>
    </g>
  </g>

  <text x="540" y="1292" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="28" letter-spacing="1.2" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
