<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 225" width="200" height="225" role="img" aria-label="Migrando para BIM">
  <title>Migrando para BIM — símbolo</title>
