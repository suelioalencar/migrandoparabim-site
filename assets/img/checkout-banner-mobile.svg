<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-label="Migrando para BIM 2.0 — com Revit e Pro-Elétrica">
  <title>Migrando para BIM 2.0 — checkout (mobile)</title>
  <defs>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#1c6f9e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#155a82" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#0a1826" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ffd400" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#ffd400" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8dc"/>
      <stop offset="1" stop-color="#bfe0f2"/>
    </linearGradient>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="720" fill="#0a1826"/>
  <ellipse cx="540" cy="360" rx="530" ry="360" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1080" height="4" fill="url(#ruleFade)"/>

  <!-- ícone centralizado -->
  <g transform="translate(425.8,42) scale(1.11)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif">
    <text x="540" y="360" font-weight="800" font-size="60" letter-spacing="-0.5" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="540" y="452" font-weight="800" font-size="84" letter-spacing="-0.5" fill="url(#bimGrad)">BIM <tspan fill="#ffd400">2.0</tspan></text>
    <text x="540" y="508" font-weight="600" font-size="32" fill="#a9c2d3">com Revit + Pro-Elétrica</text>
  </g>

  <!-- selos 2x2 -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="0.6">
    <g transform="translate(280,560)">
      <rect width="250" height="52" rx="26" fill="#16324a" stroke="#24425e"/>
      <text x="125" y="33" text-anchor="middle" fill="#eaf2f8">ACESSO VITALÍCIO</text>
    </g>
    <g transform="translate(550,560)">
      <rect width="250" height="52" rx="26" fill="#16324a" stroke="#24425e"/>
      <text x="125" y="33" text-anchor="middle" fill="#eaf2f8">7 DIAS DE GARANTIA</text>
    </g>
    <g transform="translate(280,626)">
      <rect width="250" height="52" rx="26" fill="#16324a" stroke="#24425e"/>
      <text x="125" y="33" text-anchor="middle" fill="#eaf2f8">+200 ALUNOS</text>
    </g>
    <g transform="translate(550,626)">
      <rect width="250" height="52" rx="26" fill="#ffd400"/>
      <text x="125" y="33" text-anchor="middle" fill="#0f2439">6 MESES DE PLUGIN*</text>
    </g>
  </g>
</svg>
