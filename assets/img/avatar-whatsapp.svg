<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Migrando para BIM 2.0 — Grupo de Suporte">
  <title>Migrando para BIM 2.0 — Grupo de Suporte</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#122c45"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1"    stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#1c6f9e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#155a82" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#0a1826" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <ellipse cx="512" cy="430" rx="470" ry="470" fill="url(#glowBlue)"/>

  <!-- símbolo -->
  <g transform="translate(323.6,153.9) scale(1.833)" filter="url(#markShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#24486a" stroke="#4373a0" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- wordmark empilhado -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif">
    <text x="512" y="632" font-weight="800" font-size="46" letter-spacing="2" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="512" y="726" font-weight="800" font-size="92" letter-spacing="-1" fill="#7fb8dc">BIM <tspan fill="#ffd400">2.0</tspan></text>
  </g>

  <rect x="402" y="766" width="220" height="4" rx="2" fill="#ffd400" opacity="0.85"/>

  <text x="512" y="836" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="42" letter-spacing="4" fill="#ffd400">GRUPO DE SUPORTE</text>
</svg>
