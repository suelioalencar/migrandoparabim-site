<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Migrando para BIM 2.0 — oferta de lançamento com 20% de desconto">
  <title>Migrando para BIM 2.0 — oferta de lançamento (stories 9:16)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0f2439"/>
      <stop offset="0.55" stop-color="#0a1826"/>
      <stop offset="1"    stop-color="#081320"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1481b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1481b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb8dc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="bimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8dc"/>
      <stop offset="1" stop-color="#bfe0f2"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd400" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <ellipse cx="180"  cy="260"  rx="760" ry="760" fill="url(#glowBlue)"/>
  <ellipse cx="920"  cy="1760" rx="620" ry="600" fill="url(#glowWarm)"/>
  <rect x="0" y="0" width="1080" height="8" fill="#ffd400"/>

  <!-- eyebrow (dentro da área segura do stories) -->
  <g transform="translate(314,296)">
    <rect x="0" y="0" width="452" height="60" rx="30" fill="#ffd400"/>
    <text x="226" y="40" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="23" letter-spacing="2.6" fill="#0f2439">OFERTA DE LANÇAMENTO</text>
  </g>

  <!-- marca -->
  <ellipse cx="540" cy="590" rx="400" ry="360" fill="url(#glowBlue)" opacity="0.9"/>
  <g transform="translate(344.7,403.3) scale(1.9)" filter="url(#softShadow)">
    <g transform="matrix(0.9,0,0,0.9,-5.23467,-4.728774)">
      <rect x="20" y="90" width="150" height="150" rx="14" fill="#7fb8dc"/>
      <rect x="45" y="55" width="150" height="150" rx="14" fill="#1481b8"/>
      <rect x="70" y="20" width="150" height="150" rx="14" fill="#1b3a56" stroke="#33587a" stroke-width="2"/>
      <path d="M 97.5,15 V 141.5 H 114 V 245 l 38.5,-138 h -22 l 22,-92 z"
            fill="#ffd400" stroke="#0a1826" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
    </g>
  </g>

  <!-- selo -->
  <g transform="translate(872,780)" filter="url(#softShadow)">
    <circle r="118" fill="#ffd400"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="66" fill="#0f2439">20%</text>
    <text x="0" y="48" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
          font-weight="800" font-size="40" letter-spacing="3" fill="#0f2439">OFF</text>
  </g>

  <!-- título -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" letter-spacing="-1">
    <text x="540" y="1000" font-weight="800" font-size="64" fill="#f4f7fa">MIGRANDO PARA</text>
    <text x="540" y="1128" font-weight="800" font-size="110" fill="url(#bimGrad)">BIM <tspan fill="#ffd400">2.0</tspan></text>
    <text x="540" y="1190" font-weight="600" font-size="38" letter-spacing="0" fill="#a9c2d3">com Revit + <tspan fill="#7fb8dc">Pro-Elétrica</tspan></text>
  </g>

  <rect x="290" y="1234" width="500" height="4" rx="2" fill="url(#ruleGrad)"/>

  <!-- preço -->
  <g text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif">
    <text x="540" y="1310" font-weight="600" font-size="34" fill="#7c93a5" text-decoration="line-through">De R$ 649,00</text>
    <text x="540" y="1406" font-weight="800" font-size="76" fill="#ffd400">12x de R$ 53,70</text>
    <text x="540" y="1462" font-weight="500" font-size="33" fill="#dbe9f4">ou R$ 519,20 à vista</text>
  </g>

  <!-- cupom -->
  <g transform="translate(180,1508)">
    <rect x="0" y="0" width="720" height="94" rx="20" fill="#ffd400" fill-opacity="0.1"
          stroke="#ffd400" stroke-width="2" stroke-dasharray="12 9"/>
    <text x="48" y="60" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
          font-size="27" letter-spacing="2" fill="#a9c2d3">CUPOM</text>
    <text x="196" y="61" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="38" letter-spacing="2.5" fill="#ffd400">LANCAMENTO20MB</text>
  </g>

  <!-- selos (2 linhas, mais folga nas laterais) -->
  <g font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="1">
    <g transform="translate(120,1648)">
      <rect width="400" height="60" rx="30" fill="#16324a" stroke="#24425e"/>
      <text x="200" y="38" text-anchor="middle" fill="#eaf2f8">9 MÓDULOS GRAVADOS</text>
    </g>
    <g transform="translate(560,1648)">
      <rect width="400" height="60" rx="30" fill="#16324a" stroke="#24425e"/>
      <text x="200" y="38" text-anchor="middle" fill="#eaf2f8">38 AULAS · +14H</text>
    </g>
    <g transform="translate(340,1724)">
      <rect width="400" height="60" rx="30" fill="#ffd400"/>
      <text x="200" y="38" text-anchor="middle" fill="#0f2439">ACESSO VITALÍCIO</text>
    </g>
  </g>

  <text x="540" y="1836" text-anchor="middle" font-family="Montserrat, Poppins, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="28" letter-spacing="1.2" fill="#7fb8dc">migrandoparabim.com.br</text>
</svg>
